<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none" role="img" aria-label="Havlo">
  <title>Havlo</title>
  <!-- Same mark as logo.svg -->
  <rect x="0" y="8" width="40" height="40" rx="9" fill="#0057FF"/>
  <g fill="#FFFFFF">
    <rect x="11" y="17" width="4.4" height="22" rx="1"/>
    <rect x="11" y="24" width="17" height="4.4" rx="1"/>
    <rect x="23.6" y="24" width="4.4" height="15" rx="1"/>
  </g>
  <!-- Wordmark in white, for use on dark backgrounds -->
  <text
    x="52" y="38"
    font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-1.2"
    fill="#FFFFFF"
  >havlo</text>
</svg>
