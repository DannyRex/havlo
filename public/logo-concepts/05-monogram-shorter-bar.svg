<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Havlo concept 5: monogram H with shorter right bar">
  <title>Havlo · h-shorter-bar</title>
  <rect width="1024" height="1024" rx="128" fill="#0057FF"/>
  <g fill="#FFFFFF">
    <!-- Left vertical: full height (the "anchor" / original price) -->
    <rect x="284" y="208" width="120" height="608" rx="28"/>
    <!-- Mid horizontal bar -->
    <rect x="284" y="464" width="456" height="120" rx="28"/>
    <!-- Right vertical: noticeably SHORTER (price-drop metaphor) -->
    <rect x="620" y="464" width="120" height="352" rx="28"/>
    <!-- Tiny accent dot at the top of the right vertical, hinting "this is where the original ended" -->
    <circle cx="680" cy="320" r="48" fill="#FFFFFF" opacity="0.45"/>
  </g>
</svg>
