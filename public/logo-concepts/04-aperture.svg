<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Havlo concept 4: aperture lens">
  <title>Havlo · aperture</title>
  <rect width="1024" height="1024" rx="128" fill="#0057FF"/>
  <!-- Outer ring of the lens -->
  <circle cx="512" cy="512" r="288" fill="none" stroke="#FFFFFF" stroke-width="64"/>
  <!-- Two intersecting curved blades suggesting an aperture / focus / find -->
  <g fill="#FFFFFF">
    <path d="M512 256 A 256 256 0 0 1 740 388 L 512 512 Z"/>
    <path d="M740 388 A 256 256 0 0 1 740 636 L 512 512 Z" opacity="0.65"/>
  </g>
  <!-- Centre dot anchors the eye -->
  <circle cx="512" cy="512" r="36" fill="#FFFFFF"/>
</svg>
