name: Refresh FX rates

# Daily currency-rate refresh into the fx_rates table (migration 0072) that
# the SQL RPCs (via fx_rate()) and TS (via src/lib/fx.ts) read instead of a
# hardcoded USD->NGN. Runs at 03:00 UTC -- BEFORE the 05:00 scrape/ingest
# workflows, so a day's ingest normalises USD offers at the fresh rate.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# The fetch step regenerates src/lib/fx-rates.generated.ts (the display-rate
# mirror country.ts reads); committing it back needs contents:write, same as
# the scrape cron that commits deals.ts.
permissions:
  contents: write

jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # NGN policy (Jun 2026): NGN now tracks the LIVE market rate daily, the
      # same as every other currency -- there is no longer a hand-set naira
      # value to remember to review. Post-float the official/interbank and
      # parallel/street rates have largely converged, and the old static 1650
      # seed had drifted ~20% above the live market. Leave NGN_PARALLEL_PREMIUM
      # UNSET for the pure live market rate (premium 1.0). Set it (e.g. "1.08")
      # ONLY if you later decide to layer a parallel/street cushion on top.
      # NGN_PARALLEL_PREMIUM: "1.08"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch + upsert FX rates
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run fetch:fx

      # Commit the regenerated display-rate mirror only when it actually
      # changed (display rates move slowly, so this rarely fires). Rebase +
      # retry on a rejected push so a concurrent commit doesn't fail the run.
      - name: Commit refreshed display rates if changed
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          if git diff --quiet src/lib/fx-rates.generated.ts; then
            echo "Display rates unchanged."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/fx-rates.generated.ts
            git commit -m "chore: refresh display FX rates [$(date '+%Y-%m-%d')]"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push rejected (attempt $attempt), rebasing onto main..."
              git fetch origin main && git rebase origin/main
            done
          fi
