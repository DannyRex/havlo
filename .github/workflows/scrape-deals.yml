name: Refresh data (scrape + ingest)

on:
  schedule:
    # Twice weekly — Monday + Thursday at 6:00 AM WAT (5:00 AM UTC).
    # SerpAPI Starter ships 1,000 credits/month; daily fan-out
    # (60 calls × 30 days = 1,800/month) blew the budget. Twice
    # weekly = 60 × 8 = 480/month, leaving ~500 credits for the
    # curated ingest + live search + buffer. Bump back to daily
    # if you upgrade to Developer ($75/mo, 5,000 credits) or
    # Production ($150/mo, 15,000 credits).
    - cron: "0 5 * * 1,4"
  workflow_dispatch:
    # Manual run from GitHub UI. Inputs let us refresh just the
    # free data sources (Playwright scrapers + AliExpress affiliate
    # API) without burning ~60 SerpAPI credits when we just want to
    # validate a scraper change.
    inputs:
      skip_serpapi:
        description: "Skip the paid SerpAPI ingest (free run)"
        type:        boolean
        required:    false
        default:     false

# Required so the auto-injected GITHUB_TOKEN can `git push` the refreshed deals
# back to the repo. Without this, the default token is read-only on `contents`
# and the commit step fails with HTTP 403.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Job-level env mapping. Secrets MUST be lifted here (not just per
    # step) because GitHub Actions evaluates step-level `if:` before
    # the step's own env block is applied — so referencing
    # env.SECRET_X in a step's if always returns empty string when
    # the env is only declared on that same step.
    #
    # With job-level env, every step (including their if conditions)
    # can read env.SECRET_X reliably.
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALIEXPRESS_APP_KEY:         ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET:      ${{ secrets.ALIEXPRESS_APP_SECRET }}
      SERPAPI_KEY:                ${{ secrets.SERPAPI_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scrapers
        run: npm run scrape

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet src/lib/data/deals.ts || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & push if deals changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          # Use the canonical github-actions[bot] identity. Vercel recognizes
          # this and won't block the deploy; a made-up email like
          # bot@dealesty.vercel.app fails Vercel's "commit author must map to
          # a GitHub account" check.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/deals.ts
          git commit -m "chore: refresh deals [$(date '+%Y-%m-%d')]"
          # Scrape can take 15-25 min; main may have moved during the run
          # (manual commits, other automations). Rebase + retry once on
          # push rejection so we don't lose the data refresh.
          for attempt in 1 2 3; do
            if git push; then
              echo "✓ Push succeeded on attempt $attempt"
              break
            fi
            echo "✗ Push rejected (attempt $attempt). Rebasing onto remote main…"
            git fetch origin main
            git rebase origin/main
          done

      # ── Diagnostic: prints LENGTHS (never values) of every secret-
      # backed env var so we can see exactly what the runner has
      # populated. If a length shows 0, that secret is missing or
      # empty in repo Settings → Secrets and variables → Actions →
      # Repository secrets. If lengths are nonzero but the conditional
      # ingest steps below still skip, the `env.X` evaluation in
      # step-level `if:` is the bug — switch those `if:` conditions
      # to use the `secrets` context directly.
      - name: Debug — env presence check
        run: |
          echo "::group::Env presence (lengths only — no values leaked)"
          echo "SUPABASE_URL=${#SUPABASE_URL}"
          echo "SUPABASE_SERVICE_ROLE_KEY=${#SUPABASE_SERVICE_ROLE_KEY}"
          echo "ALIEXPRESS_APP_KEY=${#ALIEXPRESS_APP_KEY}"
          echo "ALIEXPRESS_APP_SECRET=${#ALIEXPRESS_APP_SECRET}"
          echo "SERPAPI_KEY=${#SERPAPI_KEY}"
          echo "::endgroup::"

      # ── Ingestion: pushes the refreshed deals.ts into Supabase so the
      # app's DB-backed providers serve fresh rows immediately. All env
      # vars come from the job-level env block above — no per-step
      # mappings needed.
      - name: Ingest scraped deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run ingest:scraped

      # ── Konga affiliate ingestion was here; removed because the
      # affiliate program never approved us (ghosted application).
      # Konga deals still flow via the Playwright scraper above
      # (scripts/scrapers/konga.ts) — no catalog gap. If the
      # affiliate program ever opens up, restore via git history.

      # ── AliExpress Affiliate API ingestion (global cross-border).
      # Free via AliExpress Open Platform. Skipped when AliExpress
      # credentials aren't set.
      - name: Ingest AliExpress affiliate deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.ALIEXPRESS_APP_KEY != '' && env.ALIEXPRESS_APP_SECRET != ''
        run: npm run ingest:aliexpress

      # ── Live SerpAPI ingestion: 6 countries × 10 categories. Skipped
      # automatically when SERPAPI_KEY isn't set so devs can run the
      # workflow on a dry repo without burning API credits.
      #
      # ALSO skipped when the manual run sets `skip_serpapi=true`.
      # Useful for re-running just the Playwright scrapers + AliExpress
      # affiliate after fixing a selector without paying the ~60-credit
      # SerpAPI tax. Cron runs always include SerpAPI (no skip flag
      # available there).
      #
      # --limit=50 (was the script default 20). One SerpAPI search is
      # one credit regardless of result count, so bumping the per-call
      # ceiling is free and roughly doubles the deal pool surfacing on
      # /deals + /compare each cycle. Without this, a category like
      # 'Audio' returns ~20 deals total per country, which felt sparse.
      - name: Ingest SerpAPI live deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.SERPAPI_KEY != '' && inputs.skip_serpapi != true
        run: npm run ingest -- --limit=50

      # ── Dedup pass: re-key product signatures with the compact
      # 'brand|model[|inches]' form and merge any near-duplicates the
      # ingest steps just created. Zero API credits — pure DB work.
      # Always runs (not gated on a provider key) so even runs with
      # only the scraped/Konga ingest stay canonical. Without this,
      # each retailer creates fresh product_ids and the cross-store
      # comparison comes from bigger and bigger un-merged trees over
      # time. See scripts/dedup-products.ts for the full rationale.
      - name: Dedup products
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run dedup
