name: Refresh data (scrape + ingest)

on:
  schedule:
    # Runs every day at 6:00 AM WAT (5:00 AM UTC)
    - cron: "0 5 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Required so the auto-injected GITHUB_TOKEN can `git push` the refreshed deals
# back to the repo. Without this, the default token is read-only on `contents`
# and the commit step fails with HTTP 403.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scrapers
        run: npm run scrape

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet src/lib/data/deals.ts || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & push if deals changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          # Use the canonical github-actions[bot] identity. Vercel recognizes
          # this and won't block the deploy; a made-up email like
          # bot@dealesty.vercel.app fails Vercel's "commit author must map to
          # a GitHub account" check.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/deals.ts
          git commit -m "chore: refresh deals [$(date '+%Y-%m-%d')]"
          git push

      # ── Ingestion: pushes the refreshed deals.ts into Supabase so the
      # app's DB-backed providers serve fresh rows immediately. Both steps
      # are gated on Supabase secrets being present so the workflow doesn't
      # fail on forks or environments without DB access.
      - name: Ingest scraped deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run ingest:scraped

      # ── Live SerpAPI ingestion: 6 countries × 10 categories. Skipped
      # automatically when SERPAPI_KEY isn't set so devs can run the
      # workflow on a dry repo without burning API credits.
      - name: Ingest SerpAPI live deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.SERPAPI_KEY != ''
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERPAPI_KEY:                ${{ secrets.SERPAPI_KEY }}
        run: npm run ingest
