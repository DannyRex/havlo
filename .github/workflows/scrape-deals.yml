name: Refresh data (scrape + ingest)

on:
  schedule:
    # Twice weekly — Monday + Thursday at 6:00 AM WAT (5:00 AM UTC).
    # SerpAPI Starter ships 1,000 credits/month; daily fan-out
    # (60 calls × 30 days = 1,800/month) blew the budget. Twice
    # weekly = 60 × 8 = 480/month, leaving ~500 credits for the
    # curated ingest + live search + buffer. Bump back to daily
    # if you upgrade to Developer ($75/mo, 5,000 credits) or
    # Production ($150/mo, 15,000 credits).
    - cron: "0 5 * * 1,4"
  workflow_dispatch:
    # Manual run from GitHub UI. Inputs let us refresh just the
    # free data sources (Playwright scrapers + AliExpress affiliate
    # API) without burning ~60 SerpAPI credits when we just want to
    # validate a scraper change.
    inputs:
      skip_serpapi:
        description: "Skip the paid SerpAPI ingest (free run)"
        type:        boolean
        required:    false
        default:     false

# Required so the auto-injected GITHUB_TOKEN can `git push` the refreshed deals
# back to the repo. Without this, the default token is read-only on `contents`
# and the commit step fails with HTTP 403.
permissions:
  contents: write

# ── Architecture (May 2026 refactor — parallel multi-job) ─────────
#
# Old: single 'scrape' job ran everything sequentially → 35-45 min.
#
# New: 5 jobs with a needs-chain that lets the 4 independent ingests
# run in parallel against the slow Playwright scrape. Wall-time drops
# to ~34 min and individual ingests can be retried without re-running
# the whole 30-min scrape.
#
#   scrape ────────┐
#   ingest-ali ────┤
#   ingest-serpapi ┼─→ dedup
#   ingest-uk ─────┘
#
# Each job re-runs the same checkout + Node + npm ci preamble. ~3-5 min
# overhead per job, but the jobs run in parallel so wall-time wins
# anyway. Total compute minutes stay roughly the same as the old
# sequential workflow (~50 billable min) but completion is faster.

jobs:

  # ── Job 1: Playwright scrape + commit refreshed deals.ts +
  #          ingest scraped → DB. These three steps stay in one
  #          job because (a) the commit needs the same checkout
  #          that ran the scrape, and (b) ingest:scraped reads the
  #          freshly-generated deals.ts before it's pushed. ──
  scrape:
    runs-on: ubuntu-latest
    # Bumped 40 → 60 (May 2026) after the Monday Mon 11 cron hit the
    # 40m cap mid-ingest. The Playwright pass came in at ~19m, but
    # the URL-first dedup added in commit 44c77d0 made ingest:scraped
    # take 20m+ (N+1 SELECT-by-(store_id, url) lookups before each
    # upsert). 60m gives 20m headroom over today's actual elapsed
    # time. Profile the ingest path separately to lower it back.
    timeout-minutes: 60

    # Job-level env mapping. Secrets MUST be lifted here (not just per
    # step) because GitHub Actions evaluates step-level `if:` before
    # the step's own env block is applied — so referencing
    # env.SECRET_X in a step's if always returns empty string when
    # the env is only declared on that same step.
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scrapers
        run: npm run scrape

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet src/lib/data/deals.ts || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & push if deals changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          # Use the canonical github-actions[bot] identity. Vercel recognizes
          # this and won't block the deploy; a made-up email like
          # bot@dealesty.vercel.app fails Vercel's "commit author must map to
          # a GitHub account" check.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/deals.ts
          git commit -m "chore: refresh deals [$(date '+%Y-%m-%d')]"
          # Scrape can take 15-25 min; main may have moved during the run
          # (manual commits, other automations). Rebase + retry once on
          # push rejection so we don't lose the data refresh.
          for attempt in 1 2 3; do
            if git push; then
              echo "✓ Push succeeded on attempt $attempt"
              break
            fi
            echo "✗ Push rejected (attempt $attempt). Rebasing onto remote main…"
            git fetch origin main
            git rebase origin/main
          done

      # ── Ingestion: pushes the refreshed deals.ts into Supabase so the
      # app's DB-backed providers serve fresh rows immediately. Stays in
      # this job because it reads the just-generated deals.ts.
      - name: Ingest scraped deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run ingest:scraped

  # ── Job 2: AliExpress affiliate ingest. Independent API call to
  #          the AliExpress Open Platform — doesn't depend on the
  #          Playwright scrape. Runs in parallel with the scrape job.
  #          Free (no SerpAPI credits), ~2-3 min of work + 2-3 min
  #          npm ci overhead. ──
  ingest-aliexpress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALIEXPRESS_APP_KEY:         ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET:      ${{ secrets.ALIEXPRESS_APP_SECRET }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ingest AliExpress affiliate deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.ALIEXPRESS_APP_KEY != '' && env.ALIEXPRESS_APP_SECRET != ''
        run: npm run ingest:aliexpress

  # ── Job 3: SerpAPI standard ingest. 6 countries × 10 categories ×
  #          50-result limit = 60 calls per run. Independent of the
  #          Playwright scrape — runs in parallel.
  #          Skipped automatically when SERPAPI_KEY is unset (dev
  #          checkout) OR when the manual run sets skip_serpapi=true.
  #          Cron always runs it (~480 credits/month against the
  #          1,000-credit Starter plan). ──
  ingest-serpapi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERPAPI_KEY:                ${{ secrets.SERPAPI_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # --limit=50 (was the script default 20). One SerpAPI search is
      # one credit regardless of result count, so bumping the per-call
      # ceiling is free and roughly doubles the deal pool surfacing on
      # /deals + /compare each cycle. Without this, a category like
      # 'Audio' returns ~20 deals total per country, which felt sparse.
      - name: Ingest SerpAPI live deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.SERPAPI_KEY != '' && inputs.skip_serpapi != true
        run: npm run ingest -- --limit=50

  # ── Job 4: UK retailer-biased SerpAPI ingest. Standard ingest above
  #          uses category names ("Phones", "Laptops") which Google
  #          Shopping UK ranks Amazon-first for, leaving the UK pool
  #          dominated by Amazon UK + cross-border. This step queries
  #          SerpAPI with retailer-prefixed SKUs ("Argos iPhone 17",
  #          "Currys MacBook Pro M4") and filters to keep only on-
  #          target retailer rows.
  #          ~96 SerpAPI credits per run (8 retailers × 14 SKUs, after
  #          dedup against the standard ingest). Twice-weekly cron =
  #          ~192/month, fits under the 1,000-credit Starter plan
  #          alongside the standard ingest's ~480/month. ──
  ingest-uk-retailers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERPAPI_KEY:                ${{ secrets.SERPAPI_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ingest UK retailer deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.SERPAPI_KEY != '' && inputs.skip_serpapi != true
        run: npm run ingest:uk-retailers

  # ── Job 5: Dedup pass. Re-keys product signatures with the compact
  #          'brand|model[|inches]' form and merges any near-
  #          duplicates the four ingest jobs just created. Pure DB
  #          work, no API credits, ~1-2 min.
  #          MUST run after all four ingest jobs land their data,
  #          otherwise it dedups against an incomplete catalog and
  #          leaves cross-source duplicates lying around.
  #          if: always() so dedup still runs even if an upstream
  #          ingest failed — better to dedup the partial catalog than
  #          skip the merge entirely. ──
  dedup:
    needs: [scrape, ingest-aliexpress, ingest-serpapi, ingest-uk-retailers]
    # success() || failure() runs dedup whenever the workflow ran to
    # completion (any combo of pass/fail across upstream jobs), but
    # NOT when the workflow was manually cancelled — that would waste
    # ~3 min of runner time on a no-op dedup.
    if: success() || failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dedup products
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run dedup

  # ── Job 5: Send the twice-weekly newsletter digest. Runs after
  #          everything else completes so the digest pulls the
  #          freshly-deduped catalog, not a half-ingested snapshot.
  #          Only fires when all upstream jobs succeeded — skipping
  #          a digest is preferable to sending one built from
  #          partial / failed data.
  send-newsletter:
    needs: [scrape, ingest-aliexpress, ingest-serpapi, ingest-uk-retailers, dedup]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Send digest to active subscribers
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.RESEND_API_KEY != ''
        run: npm run newsletter:send
