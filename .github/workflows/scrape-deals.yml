name: Refresh data (scrape + ingest)

on:
  schedule:
    # 3x / week (Mon, Wed, Fri at 05:00 UTC). The free companion workflow
    # (scrape-free-daily.yml) covers the other four days (Sun/Tue/Thu/Sat),
    # so the catalog refreshes daily; these three are the PAID SerpAPI days
    # and the newsletter ships right after each. GitHub Actions is free
    # (public repo = unlimited hosted-runner minutes).
    #
    # SerpAPI cost (Developer plan = 5,000 credits/mo). Per run, after
    # dropping the dead-yield Temu lane (Temu pulled its Google Shopping
    # listings Apr 2025):
    #     standard ingest         60   (12 categories x 5 countries)
    #     jumia (+img backfill)   ~54   (29 queries + ~25 google_images)
    #     ng long-tail            72   (Slot 12 + Kara 10 + Konga 14, x2)
    #     uk retailers            42   (sum of per-retailer FLAGSHIP_SKUS)
    #     cross-border (SHEIN)    40   (4 markets x 10 SKUs)
    #     -------------------------------
    #     ~270 credits/run  x  ~13 runs/mo  =  ~3,500/mo  (~70% of plan)
    #
    # Leaves ~1,500/mo for live-search + growth. (Jun 2026 recount: the
    # earlier "~1,384/mo" here was stale, pre-Konga and pre-cross-border.)
    # True daily would be ~270 x 30 = ~8,200/mo, OVER the 5k ceiling, so
    # daily needs a plan bump, not just a cron change. Note a cadence
    # change touches three places: this cron, the complementary cron in
    # scrape-free-daily.yml, AND the day-name copy in the newsletter
    # components + templates. Newsletter is decoupled-ready: send-newsletter
    # only needs the dedup job to succeed, so partial ingest failures
    # don't block the digest.
    - cron: "0 5 * * 1,3,5"
  workflow_dispatch:
    # Manual run from GitHub UI. Inputs let us refresh just the
    # free data sources (Playwright scrapers + AliExpress affiliate
    # API) without burning ~60 SerpAPI credits when we just want to
    # validate a scraper change.
    inputs:
      skip_serpapi:
        description: "Skip the paid SerpAPI ingest (free run)"
        type:        boolean
        required:    false
        default:     false
      enrich:
        description: "Force full-price enrichment for high-value categories (auto-on Wednesdays)"
        type:        boolean
        required:    false
        default:     false

# Required so the auto-injected GITHUB_TOKEN can `git push` the refreshed deals
# back to the repo. Without this, the default token is read-only on `contents`
# and the commit step fails with HTTP 403.
permissions:
  contents: write

# ── Architecture (May 2026 refactor — parallel multi-job) ─────────
#
# Old: single 'scrape' job ran everything sequentially → 35-45 min.
#
# New: 5 jobs with a needs-chain that lets the 4 independent ingests
# run in parallel against the slow Playwright scrape. Wall-time drops
# to ~34 min and individual ingests can be retried without re-running
# the whole 30-min scrape.
#
#   scrape ────────┐
#   ingest-ali ────┤
#   ingest-serpapi ┼─→ dedup
#   ingest-uk ─────┘
#
# Each job re-runs the same checkout + Node + npm ci preamble. ~3-5 min
# overhead per job, but the jobs run in parallel so wall-time wins
# anyway. Total compute minutes stay roughly the same as the old
# sequential workflow (~50 billable min) but completion is faster.

jobs:

  # ── Job 1: Playwright scrape + commit refreshed deals.ts +
  #          ingest scraped → DB. These three steps stay in one
  #          job because (a) the commit needs the same checkout
  #          that ran the scrape, and (b) ingest:scraped reads the
  #          freshly-generated deals.ts before it's pushed. ──
  scrape:
    runs-on: ubuntu-latest
    # Bumped 40 → 60 (May 2026) after the Monday Mon 11 cron hit the
    # 40m cap mid-ingest. The Playwright pass came in at ~19m, but
    # the URL-first dedup added in commit 44c77d0 made ingest:scraped
    # take 20m+ (N+1 SELECT-by-(store_id, url) lookups before each
    # upsert). 60m gives 20m headroom over today's actual elapsed
    # time. Profile the ingest path separately to lower it back.
    timeout-minutes: 60

    # Job-level env mapping. Secrets MUST be lifted here (not just per
    # step) because GitHub Actions evaluates step-level `if:` before
    # the step's own env block is applied — so referencing
    # env.SECRET_X in a step's if always returns empty string when
    # the env is only declared on that same step.
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scrapers
        run: npm run scrape

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet src/lib/data/deals.ts || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & push if deals changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          # Use the canonical github-actions[bot] identity. Vercel recognizes
          # this and won't block the deploy; a made-up email like
          # bot@dealesty.vercel.app fails Vercel's "commit author must map to
          # a GitHub account" check.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/deals.ts
          git commit -m "chore: refresh deals [$(date '+%Y-%m-%d')]"
          # Scrape can take 15-25 min; main may have moved during the run
          # (manual commits, other automations). Rebase + retry once on
          # push rejection so we don't lose the data refresh.
          for attempt in 1 2 3; do
            if git push; then
              echo "✓ Push succeeded on attempt $attempt"
              break
            fi
            echo "✗ Push rejected (attempt $attempt). Rebasing onto remote main…"
            git fetch origin main
            git rebase origin/main
          done

      # ── Ingestion: pushes the refreshed deals.ts into Supabase so the
      # app's DB-backed providers serve fresh rows immediately. Stays in
      # this job because it reads the just-generated deals.ts.
      - name: Ingest scraped deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run ingest:scraped

  # ── Job 2: AliExpress affiliate ingest. Independent API call to
  #          the AliExpress Open Platform — doesn't depend on the
  #          Playwright scrape. Runs in parallel with the scrape job.
  #          Free (no SerpAPI credits), ~2-3 min of work + 2-3 min
  #          npm ci overhead. ──
  ingest-aliexpress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALIEXPRESS_APP_KEY:         ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET:      ${{ secrets.ALIEXPRESS_APP_SECRET }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ingest AliExpress affiliate deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.ALIEXPRESS_APP_KEY != '' && env.ALIEXPRESS_APP_SECRET != ''
        run: npm run ingest:aliexpress

  # ── Job 3: SerpAPI standard ingest. 5 countries × 12 categories ×
  #          50-result limit = 60 calls per run. Independent of the
  #          Playwright scrape — runs in parallel.
  #          Skipped automatically when SERPAPI_KEY is unset (dev
  #          checkout) OR when the manual run sets skip_serpapi=true.
  #          Cron always runs it (~780 credits/month against the
  #          5,000-credit Developer plan). ──
  ingest-serpapi:
    runs-on: ubuntu-latest
    # Timeout history:
    #   25 (initial) → 15 (post batch-refactor that cut wall-time to
    #     ~5-7 min) → 25 (restored May 2026 after the SerpAPI geo-
    #     bias landed; google.de / google.co.za / google.ae routing
    #     adds ~1-2s per call AND the wider category fan-out runs
    #     longer per country. Re-audit caught a 15m16s timeout on
    #     the May 18 manual trigger right after the Developer-plan
    #     credit top-up — the script reached "de Audio" before
    #     getting killed, with all 6 countries × ~6 categories
    #     still to go. 25m gave headroom THEN, but by late May 2026 the job
    #     outgrew it too: the May 28 + Jun 1 scheduled runs were CANCELLED at
    #     25m15s, which cascades to SKIP the dependent dedup + send-newsletter
    #     jobs and shows the whole run as cancelled (so SerpAPI data stopped
    #     refreshing + no newsletter went out). Bumped to 50m. The SerpAPI
    #     call count is fixed (6 countries × categories), so this adds time,
    #     not credits. If it ever times out again, SPLIT into per-country
    #     ingest jobs rather than bumping further.
    timeout-minutes: 50
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERPAPI_KEY:                ${{ secrets.SERPAPI_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # --limit=50 (was the script default 20). One SerpAPI search is
      # one credit regardless of result count, so bumping the per-call
      # ceiling is free and roughly doubles the deal pool surfacing on
      # /deals + /compare each cycle. Without this, a category like
      # 'Audio' returns ~20 deals total per country, which felt sparse.
      - name: Ingest SerpAPI live deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.SERPAPI_KEY != '' && inputs.skip_serpapi != true
        run: |
          FLAGS="--limit=50"
          # Wednesday (UTC day-of-week 3), OR a manual run with enrich=true:
          # keep full-price rows for the high-value (market-mode) categories
          # so the PDP spectrum + /compare capture the honest market range,
          # not just discounts. No extra SerpAPI credits — same searches, we
          # just retain more of each response. Mon/Fri stay deals-only.
          if [ "$(date -u +%u)" = "3" ] || [ "${{ inputs.enrich }}" = "true" ]; then
            FLAGS="$FLAGS --enrich"
            echo "::notice::Full-price enrichment ON (high-value categories)"
          fi
          npm run ingest -- $FLAGS

  # ── Job 4a: Jumia ingest via SerpAPI's dedicated `engine=jumia`.
  #           Replaces the Playwright Jumia scraper which Cloudflare
  #           defeats. Runs in parallel with the other ingest jobs.
  #           ~29 credits/run for the curated NG query list (phones,
  #           computing, electronics, audio, appliances, fashion, beauty,
  #           gaming) + ~20-30 for the post-ingest google_images backfill
  #           = ~54/run. 3x/week (~13 runs/mo) = ~700/month. ──
  ingest-jumia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERPAPI_KEY:                ${{ secrets.SERPAPI_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # May 2026: day-gate removed. The earlier "Thursday only" gate
      # saved ~68 SerpAPI calls/month against the 1k Starter cap, but
      # the upgrade to the 5k Developer plan made that saving noise.
      # Jumia now refreshes on Mon, Wed + Fri like every other ingest
      # source, so NG catalog freshness matches the rest of the world.
      - name: Ingest Jumia deals (SerpAPI engine=jumia) → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.SERPAPI_KEY != '' && inputs.skip_serpapi != true
        run: npm run ingest:jumia

      # NG long-tail retailers via SerpAPI site:domain queries.
      # Replaces the broken/silent Playwright scrapers for Slot + Kara +
      # Konga (and future merchants added to NG_MERCHANT_CONFIGS). Same
      # job as Jumia so dedup's `needs` chain doesn't have to widen, and
      # both jobs share the same SerpAPI credit pool.
      # Konga joined this lane June 2026 after Konga's mid-May 2026
      # Cloudflare bot wall killed its Playwright scraper; its 14-query
      # list rides the same google + site:konga.com path as Slot + Kara.
      # Cost: each query fires google + google_images = 2 credits, so
      # ~72 credits per run today (Slot 12 + Kara 10 + Konga 14 queries =
      # 36 queries x 2). 3x/week (~13 runs/month) = ~940 credits/month,
      # comfortably under the 5,000 Developer plan ceiling.
      # Grows linearly with merchants added to the config — each new
      # merchant adds (its query-list count x 2) to the per-run cost.
      - name: Ingest NG long-tail merchants (SerpAPI site-filter) → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.SERPAPI_KEY != '' && inputs.skip_serpapi != true
        run: npm run ingest:ng-serpapi

      # NG Shopify-based retailers via /collections/all/products.json
      # public JSON endpoint — pure node-fetch, no Playwright, no
      # SerpAPI credits. Wire here so 3C Hub (and future NG Shopify
      # stores) get a guaranteed clean ingest independent of the
      # browser orchestrator's per-job time budget. Runs even when
      # SerpAPI is skipped because no credits are required.
      - name: Ingest NG Shopify-based retailers → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run ingest:ng-shopify

  # ── Job 4: UK retailer-biased SerpAPI ingest. Standard ingest above
  #          uses category names ("Phones", "Laptops") which Google
  #          Shopping UK ranks Amazon-first for, leaving the UK pool
  #          dominated by Amazon UK + cross-border. This step queries
  #          SerpAPI with retailer-prefixed SKUs ("Argos iPhone 17",
  #          "Currys MacBook Pro M4") and filters to keep only on-
  #          target retailer rows.
  #          ~42 SerpAPI credits per run (sum of each retailer's
  #          FLAGSHIP_SKUS list; credits are charged per search, before
  #          the post-fetch dedup). 3x/week (~13 runs/mo) = ~550/month,
  #          alongside the standard ingest's ~780/month. ──
  ingest-uk-retailers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERPAPI_KEY:                ${{ secrets.SERPAPI_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ingest UK retailer deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.SERPAPI_KEY != '' && inputs.skip_serpapi != true
        run: npm run ingest:uk-retailers

      # Cross-border marketplace ingest (SHEIN). SerpAPI has no native
      # SHEIN engine, so this reuses the google_shopping provider with
      # retailer-suffixed queries ("<sku> SHEIN") filtered to on-target
      # rows -- same shape as the UK step above. Fashion/beauty SKUs only,
      # 4 markets x 10 SKUs = ~40 credits/run, ~520/month. Temu was
      # dropped Jun 2026 (--merchants=shein below): it pulled its Google
      # Shopping listings 2025-04-09, so its yield was ~0 yet it doubled
      # this lane's cost. Re-add it to the --merchants list if it returns.
      - name: Ingest cross-border (SHEIN + Temu) deals → Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.SERPAPI_KEY != '' && inputs.skip_serpapi != true
        run: npm run ingest:cross-border -- --merchants=shein

  # ── Job 5: Dedup pass. Re-keys product signatures with the compact
  #          'brand|model[|inches]' form and merges any near-
  #          duplicates the four ingest jobs just created. Pure DB
  #          work, no API credits, ~1-2 min.
  #          MUST run after all four ingest jobs land their data,
  #          otherwise it dedups against an incomplete catalog and
  #          leaves cross-source duplicates lying around.
  #          if: always() so dedup still runs even if an upstream
  #          ingest failed — better to dedup the partial catalog than
  #          skip the merge entirely. ──
  dedup:
    needs: [scrape, ingest-aliexpress, ingest-serpapi, ingest-uk-retailers, ingest-jumia]
    # success() || failure() runs dedup whenever the workflow ran to
    # completion (any combo of pass/fail across upstream jobs), but
    # NOT when the workflow was manually cancelled — that would waste
    # ~3 min of runner time on a no-op dedup.
    if: success() || failure()
    runs-on: ubuntu-latest
    # 10 -> 20 (Jun 2026): the self-host-images step below adds a few minutes
    # for newly-ingested products (steady-state ~hundreds/run; capped at 3000).
    timeout-minutes: 20
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dedup products
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run dedup

      # Seed a "tracking starts now" price-history point for any offer
      # ingested this cycle that doesn't have one yet (#24). Runs AFTER
      # dedup so it seeds the canonical post-merge offers, not duplicates
      # that are about to be collapsed. Mirrors the identical step in
      # scrape-free-daily.yml's dedup job: without it, a product ingested
      # on the Mon/Wed/Fri run rendered an empty price chart until the next
      # free-daily seed caught it. Idempotent + no API credits;
      # no-ops until migration 0067 is applied.
      - name: Seed missing price-history points
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run seed:price-history

      # Self-host newly-ingested product images into Supabase Storage (#133).
      # Runs after dedup so it hosts the canonical post-merge products, not
      # duplicates about to be collapsed. Fetches merchant images direct
      # (concurrency 32) and uploads normalized webp; idempotent (only rows
      # with stored_image_at IS NULL). Steady-state is a few hundred new
      # images/run (~30s); --limit=3000 caps a runaway. No-ops until migration
      # 0076 + the public "product-images" bucket exist.
      - name: Self-host new product images → Supabase Storage
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run backfill:self-host-images -- --limit=3000

      # Perceptual-hash newly-ingested product images (Phase 2 + 2a, #133).
      # Runs AFTER self-host so each new product is hashed from its Storage
      # webp -- the same consistent source the whole catalog was re-hashed
      # from, with the Phase 2a background-trim so product-on-white photos no
      # longer collapse to one hash. Incremental: only rows with image_phash
      # IS NULL; the Storage host is unthrottled so a few hundred new rows
      # finish in well under a minute. --limit caps a runaway. No-op once
      # every image_url row already has a hash. Feeds the isLikelySameProduct
      # phash fast-path that pools the same product across stores.
      - name: Hash new product images (dHash for cross-store matching)
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run backfill:image-phash -- --limit=3000

  # ── Job 5: Send the weekly newsletter digest. Runs after dedup
  #          completes so the digest pulls the freshly-deduped
  #          catalog, not a half-ingested snapshot.
  #
  #          Dependency narrowed to `[dedup]` only (May 2026 fix).
  #          Previously needs: included all 5 ingest jobs with
  #          if: success(), which meant ANY single upstream failure
  #          skipped the email — a SerpAPI timeout (common; the API
  #          has been flaky around credit-reset boundaries) was
  #          blocking the digest for the entire week. Now: dedup
  #          itself depends on all 5 ingests with success()||failure(),
  #          so it always runs and ALWAYS reflects whatever fresh
  #          data the surviving ingests produced. If dedup itself
  #          succeeds, the catalog is in a defensible state and
  #          the digest can ship — even if one source failed, the
  #          digest pool is still fresh from the other 4 sources +
  #          the Playwright scrape. The only case we still skip is
  #          when dedup itself failed (data layer broken) or the
  #          workflow was cancelled (intentional kill). */
  send-newsletter:
    needs: [dedup]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Loud-fail guard. Without this, a missing secret silently skips
      # the send step below (the `if:` evaluates false, step shows as
      # "skipped" with a green check, and the job's overall conclusion
      # is "success"). That masked a real bug from May 2026 onwards:
      # RESEND_API_KEY was never added to repo secrets, so every
      # scheduled run quietly skipped the digest. Now any missing
      # secret prints a visible warning in the Actions log AND fails
      # the job — the only way to be sure the next 2026 cron miss is
      # surfaced immediately rather than discovered weeks later by a
      # subscriber complaint.
      - name: Verify newsletter secrets present
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ]              && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$RESEND_API_KEY" ]            && missing="$missing RESEND_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Newsletter send aborted — missing secrets:$missing"
            echo "::error::Add the missing secret(s) at https://github.com/DannyRex/havlo/settings/secrets/actions"
            exit 1
          fi
          echo "✓ All newsletter secrets present"

      - name: Send digest to active subscribers
        run: npm run newsletter:send
