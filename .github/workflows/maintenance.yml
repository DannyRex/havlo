name: Maintenance (resignature + price prune)

# ── Why this exists ──────────────────────────────────────────────────
# Two cheap, idempotent maintenance jobs that keep the DB bounded as
# the catalog grows from the deal + market ingests.
#
#   resignature: walks products that have drifted from their current
#     buildSignature(title) output (after parser improvements or new
#     brand additions) and updates the signature column. Idempotent
#     re-runs produce zero changes once the catalog is clean.
#
#   price-prune: deletes price_history rows older than 90 days so
#     the table doesn't grow unboundedly. The spectrum/PDP "lowest
#     tracked" feature only reads from the last 90 days anyway, so
#     older rows are dead storage. Modest cost: ~75% of current
#     ~450K price-history rows get deleted on first run, then ~5K/week
#     thereafter as new rows roll out the back.
#
# Cadence — every Sunday at 04:00 UTC. Sunday is the quietest day
# of the week for shopper traffic, so any modest read-path impact
# from the prune (autovacuum etc.) lands when nobody's looking.

on:
  schedule:
    # Sunday at 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resignature:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - name: Re-signature products with drifted keys
        # --apply makes the script commit changes; without it, dry-run only.
        # Safe even on the first run: the merge-safety guard rejects
        # unsafe collisions (brand|? or ?|model) and the price-spread
        # guard rejects accessory-into-product over-merges.
        run: npm run resignature -- --apply

  price-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      # DISABLED June 2026. The real history table is offer_price_history
      # (the multi-store, time-stamped price graph: the moat). It must only
      # ever GROW, so there is no retention prune. This step targeted a
      # `price_history` table that does not exist (so it was already a
      # no-op), but leaving it live was a landmine: if anyone ever created
      # a price_history table or renamed offer_price_history, this would
      # start deleting 90-day-old history and destroy the asset. Keep it
      # off. If storage ever forces a policy, DOWNSAMPLE old rows (keep one
      # point per offer per week beyond N days), never hard-delete.
      # - name: Prune price_history older than 90 days
      #   run: npm run prune:price-history -- --apply
      - name: No-op (price-history retention is intentionally unlimited)
        run: echo "offer_price_history retained indefinitely (moat). No prune."

  # ── Catalog-wide stale-offer TTL sweep ────────────────────────────
  # Closes the gap that the in-ingest per-store TTL sweep leaves
  # open. The ingestDeals path only sweeps stores it ACTUALLY touched
  # this run; if a scraper is broken or a per-SKU SerpAPI / curated
  # path never hits a store, that store's stale offers accumulate
  # indefinitely. Sunday 04:00 UTC catalog-wide sweep catches them.
  #
  # User trust-break report May 29 2026: a PDP showed "Last refreshed
  # 2w ago" + a stale price. Root cause was the offer hadn't been
  # re-verified for weeks because no ingest run touched that store,
  # so the in-ingest sweep never fired for it. Adding this scheduled
  # catalog-wide pass closes that path.
  #
  # 14-day threshold matches TTL_DAYS in ingestion.ts so the two
  # paths agree on what "stale" means. Worst case the offer sits
  # stale Mon-Sat (up to 6 days past the threshold) before this sweep
  # catches it on Sunday — combined with the ProductHero amber
  # warning chip (b4f5a0e) the user still sees the staleness signal
  # during that window.
  stale-offer-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - name: Sweep offers older than 14 days to in_stock=false
        run: npm run sweep:stale-offers -- --apply --days=14

  brand-dtc-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - name: Scrape brand DTC sites (Apple / Sony / Dyson / Bose / Samsung)
        # Free — no SerpAPI calls. Hits brand sites directly with a
        # real-browser User-Agent. Anchors the upper end of the
        # spectrum with real MSRPs that Google Shopping won't surface.
        run: npm run scrape:brand-dtc
